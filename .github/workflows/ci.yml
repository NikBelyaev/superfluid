name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.ref && '["checks", "electron"]' || '["checks", "electron", "tree-search"]') }}
    env:
      electron_config_cache: ${{ github.workspace }}/node_modules/.cache/electron
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
      - run: npm install --global pnpm@12.14.0
      - id: cache
        run: |
          echo "pnpm-store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          echo "electron=$(node -p 'require("./package.json").devDependencies.electron')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache.outputs.pnpm-store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node26-pnpm12.14.0-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-node26-pnpm12.14.0-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache.outputs.electron }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules/.cache/superfluid/ty-*
          key: ty-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ty.mjs') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: node_modules/.cache/superfluid/zoekt
          key: zoekt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/zoekt.mjs') }}-${{ matrix.suite == 'checks' && 'checks' || 'electron' }}-${{ hashFiles('packages/zoekt/go.mod', 'packages/zoekt/go.sum', 'packages/zoekt/*.go') }}
          restore-keys: |
            zoekt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/zoekt.mjs') }}-${{ matrix.suite == 'checks' && 'checks' || 'electron' }}-
            zoekt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/zoekt.mjs') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        if: matrix.suite == 'checks'
      - run: pnpm format:check
        if: matrix.suite == 'checks'
      - run: pnpm typecheck
        if: matrix.suite == 'checks'
      - run: pnpm audit --audit-level high
        if: matrix.suite == 'checks'
      - run: pnpm audit --prod --audit-level moderate
        if: matrix.suite == 'checks'
      - run: pnpm test
        if: matrix.suite == 'checks'
      - run: pnpm build
        if: matrix.suite != 'checks'
      - run: pnpm test:electron:smoke
        if: matrix.suite == 'electron' && !inputs.ref
      - run: pnpm test:electron
        if: matrix.suite == 'electron' && inputs.ref
      - run: pnpm test:electron:tree
        if: matrix.suite == 'tree-search'
      - run: pnpm test:electron:search
        if: matrix.suite == 'tree-search'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && matrix.suite != 'checks'
        with:
          name: electron-results-${{ matrix.suite }}
          path: test-results
